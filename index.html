<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
        }
        .calculator-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 20px auto;
        }
        .subject-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .subject-row input, .subject-row select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .subject-row input { flex: 2; }
        .subject-row select { flex: 1; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-group button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add { background: #2196F3; color: white; }
        .btn-calc { background: #4CAF50; color: white; }
        #result { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <!-- আপনার ওয়েবসাইটের হেডার ও কন্টেন্ট -->
    <header style="text-align: center; margin-bottom: 20px;">
        <h1>Welcome to My Website</h1>
    </header>

    <!-- GPA Calculator -->
    <div class="calculator-card">
        <h3>GPA Calculator</h3>
        <div id="subject-list">
            <div class="subject-row">
                <input type="text" placeholder="Subject Name" class="sub-name">
                <select class="grade-point">
                    <option value="5.00">A+ (5.0)</option>
                    <option value="4.00">A (4.0)</option>
                    <option value="3.50">A- (3.5)</option>
                    <option value="3.00">B (3.0)</option>
                    <option value="2.00">C (2.0)</option>
                    <option value="1.00">D (1.0)</option>
                    <option value="0.00">F (0.0)</option>
                </select>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-add" onclick="addSubject()">+ Add Subject</button>
            <button class="btn-calc" onclick="calculateGPA()">Calculate</button>
        </div>

        <div id="result"></div>
    </div>

<script>
    function addSubject() {
        const container = document.getElementById('subject-list');
        const newRow = document.createElement('div');
        newRow.className = 'subject-row';
        newRow.innerHTML = `
            <input type="text" placeholder="Subject Name" class="sub-name">
            <select class="grade-point">
                <option value="5.00">A+ (5.0)</option>
                <option value="4.00">A (4.0)</option>
                <option value="3.50">A- (3.5)</option>
                <option value="3.00">B (3.0)</option>
                <option value="2.00">C (2.0)</option>
                <option value="1.00">D (1.0)</option>
                <option value="0.00">F (0.0)</option>
            </select>
        `;
        container.appendChild(newRow);
    }

    function calculateGPA() {
        const grades = document.querySelectorAll('.grade-point');
        let totalPoints = 0;
        let isFailed = false;

        grades.forEach(gradeSelect => {
            const point = parseFloat(gradeSelect.value);
            if (point === 0) {
                isFailed = true;
            }
            totalPoints += point;
        });

        const resultDiv = document.getElementById('result');

        if (isFailed) {
            resultDiv.style.color = '#e74c3c';
            resultDiv.innerHTML = "Result: Failed (F Grade in dynamic subjects)";
        } else {
            const gpa = (totalPoints / grades.length).toFixed(2);
            resultDiv.style.color = '#27ae60';
            resultDiv.innerHTML = `Your GPA: ${gpa}`;
        }
    }
</script>

</body>
</html>
