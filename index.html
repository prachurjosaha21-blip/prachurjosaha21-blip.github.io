<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .calculator-card {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .subject-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        input[type="text"] {
            flex: 2;
        }
        select {
            flex: 1;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-add { background-color: #2196F3; color: white; }
        .btn-calc { background-color: #4CAF50; color: white; }
        .btn-add:hover { background-color: #1e87db; }
        .btn-calc:hover { background-color: #43a047; }
        
        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>GPA Calculator</h2>
    <div id="subject-list">
        <div class="subject-row">
            <input type="text" placeholder="Subject Name (e.g. Bangla)" class="sub-name">
            <select class="grade-point">
                <option value="5.00">A+ (5.0)</option>
                <option value="4.00">A (4.0)</option>
                <option value="3.50">A- (3.5)</option>
                <option value="3.00">B (3.0)</option>
                <option value="2.00">C (2.0)</option>
                <option value="1.00">D (1.0)</option>
                <option value="0.00">F (0.0)</option>
            </select>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-add" onclick="addSubject()">+ Add Subject</button>
        <button class="btn-calc" onclick="calculateGPA()">Calculate</button>
    </div>

    <div id="result"></div>
</div>

<script>
    function addSubject() {
        const container = document.getElementById('subject-list');
        const newRow = document.createElement('div');
        newRow.className = 'subject-row';
        newRow.innerHTML = `
            <input type="text" placeholder="Subject Name" class="sub-name">
            <select class="grade-point">
                <option value="5.00">A+ (5.0)</option>
                <option value="4.00">A (4.0)</option>
                <option value="3.50">A- (3.5)</option>
                <option value="3.00">B (3.0)</option>
                <option value="2.00">C (2.0)</option>
                <option value="1.00">D (1.0)</option>
                <option value="0.00">F (0.0)</option>
            </select>
        `;
        container.appendChild(newRow);
    }

    function calculateGPA() {
        const grades = document.querySelectorAll('.grade-point');
        let totalPoints = 0;
        let isFailed = false;

        grades.forEach(gradeSelect => {
            const point = parseFloat(gradeSelect.value);
            if (point === 0) {
                isFailed = true;
            }
            totalPoints += point;
        });

        const resultDiv = document.getElementById('result');

        if (isFailed) {
            resultDiv.style.color = '#e74c3c';
            resultDiv.innerHTML = "Result: Failed (F Grade in dynamic subjects)";
        } else {
            const gpa = (totalPoints / grades.length).toFixed(2);
            resultDiv.style.color = '#27ae60';
            resultDiv.innerHTML = `Your GPA: ${gpa}`;
        }
    }
</script>

</body>
</html>
