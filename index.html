        <div id="result"></div>
    </div>

<script>
    function addSubject() {
        const container = document.getElementById('subject-list');
        const newRow = document.createElement('div');
        newRow.className = 'subject-row';
        newRow.innerHTML = `
            <input type="text" placeholder="Subject Name" class="sub-name">
            <select class="grade-point">
                <option value="5.00">A+ (5.0)</option>
                <option value="4.00">A (4.0)</option>
                <option value="3.50">A- (3.5)</option>
                <option value="3.00">B (3.0)</option>
                <option value="2.00">C (2.0)</option>
                <option value="1.00">D (1.0)</option>
                <option value="0.00">F (0.0)</option>
            </select>
        `;
        container.appendChild(newRow);
    }

    function calculateGPA() {
        const grades = document.querySelectorAll('.grade-point');
        let totalPoints = 0;
        let isFailed = false;

        grades.forEach(gradeSelect => {
            const point = parseFloat(gradeSelect.value);
            if (point === 0) {
                isFailed = true;
            }
            totalPoints += point;
        });

        const resultDiv = document.getElementById('result');

        if (isFailed) {
            resultDiv.style.color = '#e74c3c';
            resultDiv.innerHTML = "Result: Failed (F Grade in dynamic subjects)";
        } else {
            const gpa = (totalPoints / grades.length).toFixed(2);
            resultDiv.style.color = '#27ae60';
            resultDiv.innerHTML = `Your GPA: ${gpa}`;
        }
    }
</script>

</body>
