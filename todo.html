<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUMO | To-Do List</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: #00e5ff;
            font-family: Arial, sans-serif;
        }
        nav {
            background-color: #0a0a20;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 10px #00e5ff;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 12px;
            font-weight: bold;
            font-size: 1rem;
        }
        nav a:hover { color: #00e5ff; }
        .container {
            max-width: 400px;
            margin: 40px auto;
            padding: 25px 20px;
            border: 2px solid #00e5ff;
            border-radius: 20px;
            box-shadow: 0 0 25px #00e5ff;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #00e5ff;
            background-color: #0a0a20;
            color: #ffffff;
            outline: none;
        }
        button.add-btn {
            padding: 10px 18px;
            background-color: #00e5ff;
            color: #050510;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            background: #0a0a20;
            border: 1px solid #00e5ff;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
        }
        li.completed span {
            text-decoration: line-through;
            color: #888;
        }
        .delete-btn {
            background: #ff0055;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="calculator.html">Calculator</a>
        <a href="todo.html">To-Do List</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="container">
        <h2>To-Do List</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="নতুন কাজ লিখুন...">
            <button class="add-btn" onclick="addTask()">যোগ করুন</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();
            if (taskText === '') return;

            const li = document.createElement('li');
            li.innerHTML = `
                <span onclick="this.parentElement.classList.toggle('completed')">${taskText}</span>
                <button class="delete-btn" onclick="this.parentElement.remove()">X</button>
            `;

            document.getElementById('taskList').appendChild(li);
            input.value = '';
        }
    </script>

</body>
</html>
