<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUMO | Age Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            color: #00e5ff;
            font-family: Arial, sans-serif;
        }
        nav {
            background-color: #0a0a20;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 10px #00e5ff;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        nav a:hover { color: #00e5ff; }
        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px 20px;
            border: 2px solid #00e5ff;
            border-radius: 20px;
            box-shadow: 0 0 25px #00e5ff;
            text-align: center;
        }
        label { color: #ffffff; display: block; margin-bottom: 10px; font-size: 1.1rem; }
        input[type="date"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #00e5ff;
            background-color: #0a0a20;
            color: #ffffff;
            font-size: 1rem;
            margin-bottom: 20px;
            width: 80%;
        }
        button {
            padding: 10px 25px;
            background-color: #00e5ff;
            color: #050510;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 15px #00e5ff;
        }
        button:hover { background-color: #ffffff; }
        .result {
            margin-top: 25px;
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="calculator.html">Calculator</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="container">
        <h2>Age Calculator</h2>
        <label for="dob">আপনার জন্মতারিখ নির্বাচন করুন:</label>
        <input type="date" id="dob">
        <br>
        <button onclick="calculateAge()">বয়স হিসাব করুন</button>

        <div class="result" id="result"></div>
    </div>

    <script>
        function calculateAge() {
            const dobInput = document.getElementById('dob').value;
            if (!dobInput) {
                document.getElementById('result').innerText = "অনুগ্রহ করে একটি তারিখ নির্বাচন করুন!";
                return;
            }

            const birthDate = new Date(dobInput);
            const today = new Date();

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += lastMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('result').innerHTML = 
                `আপনার বয়স: <br><span style="color:#00e5ff;">${years} বছর, ${months} মাস, ${days} দিন</span>`;
        }
    </script>

</body>
</html>
